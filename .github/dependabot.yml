# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Version updates run weekly and are grouped to keep the PR noise low.
# Security updates (immediate PRs on a CVE) are enabled separately in
# Settings > Code security > Dependabot security updates; they ignore the
# schedule and the grouping below.
version: 2

updates:
  # Python dependencies: requirements.txt, requirements-dev.txt, setup.py
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Angular convention, required by python-semantic-release
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows (pinned by SHA, Dependabot keeps
  # both the SHA and the version comment up to date)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
