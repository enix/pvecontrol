name: Plumber

on:
  push:
    branches: [main]
  pull_request: null

permissions:
  contents: read
  security-events: write
  # id-token: write          # uncomment to publish a live Plumber Score badge (see below)

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: getplumber/plumber@d3536bae4727b9290d9e69ee25c4350ddbcd91cd # pinned plumber version: v0.6.0
        with:
          min-score: "A"
          score-push: false # set to "true" to publish a public Plumber Score badge

