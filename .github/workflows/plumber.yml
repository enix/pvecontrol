name: Plumber

on:
  push:
    branches: [main]
  pull_request: null

permissions:
  contents: read
  security-events: write
  # id-token: write          # uncomment to publish a live Plumber Score badge (see below)

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: getplumber/plumber@10837e44cddfed934eaa2b509e677286af23e149 # pinned plumber version: v0.4.63
        with:
          min-score: "A"
          score-push: false # set to "true" to publish a public Plumber Score badge

