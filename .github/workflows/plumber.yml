name: Plumber

on:
  push:
    branches: [main]
  pull_request: null

permissions:
  contents: read
  security-events: write
  # id-token: write          # uncomment to publish a live Plumber Score badge (see below)

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: getplumber/plumber@2342834dc0b67d2c87a33ac86789e481ad869402 # pinned plumber version: v0.7.17
        with:
          min-score: "A"
          score-push: false # set to "true" to publish a public Plumber Score badge

